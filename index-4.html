<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تولدت مبارک امیر 🎂</title>
<meta name="theme-color" content="#f6ecd9">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800;900&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--bg:#f6ecd9;--p:#7fa9cf;--g:#ecd9b0;--c:#bcd8ee;--v:#a2bfe0;--t:#2c4660}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--t);overflow-x:hidden;line-height:1.9}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(165deg,#fdf6e6 0%,#e6eff7 45%,#bcd6ec 100%)}
body.lock{overflow:hidden;height:100vh}
#cv{position:fixed;inset:0;z-index:60;pointer-events:none}
.b{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.6;z-index:-1;animation:mv 18s ease-in-out infinite alternate}
.b1{background:#f7e6c2;top:-22vmax;right:-22vmax}
.b2{background:#a9c8e6;bottom:-26vmax;left:-22vmax;animation-delay:-9s}
@keyframes mv{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#fdf6e6,#c9def0 80%);transition:opacity .9s,visibility .9s}
#gate.off{opacity:0;visibility:hidden}
.gi{font-size:92px;animation:bn 1.6s ease-in-out infinite}
@keyframes bn{50%{transform:translateY(-16px) rotate(-6deg)}}
#gate h2{font-weight:800;font-size:26px;margin:8px 0 22px}
.btn{font:inherit;font-weight:800;font-size:17px;color:#22405d;background:linear-gradient(120deg,#f6e6c4,#a9c8e6);border:0;border-radius:99px;padding:12px 34px;cursor:pointer;box-shadow:0 10px 30px #6f98c266;transition:transform .2s}
.btn:active{transform:scale(.94)}
.btn:focus-visible{outline:3px solid #4f86b8;outline-offset:3px}
main{position:relative;z-index:1;max-width:760px;margin:auto;padding:0 20px}
section{padding:70px 0}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 0}
.frame{position:relative;width:min(74vw,340px);padding:4px;border-radius:30px;background:conic-gradient(from var(--a),var(--p),var(--g),var(--c),var(--v),var(--p));animation:sp 6s linear infinite;box-shadow:0 12px 50px #6f98c26e;transition:transform .15s}
@keyframes sp{to{--a:360deg}}
.frame img{display:block;width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 85%;border-radius:26px}
.tag{position:absolute;bottom:-18px;left:-14px;font-size:44px;animation:bn 2.4s ease-in-out infinite}
.sm{margin-top:34px;font-weight:500;font-size:20px;letter-spacing:.04em;opacity:.85}
h1{font-weight:900;font-size:clamp(76px,26vw,170px);line-height:1.15;background:linear-gradient(100deg,#2f5f8f,#6f9fcb,#c4a468,#6f9fcb,#2f5f8f);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
.ty{min-height:3.6em;font-size:18px;opacity:.9;max-width:420px}
.ty::after{content:'|';animation:bk 1s steps(1) infinite}
@keyframes bk{50%{opacity:0}}
.sc{margin-top:14px;font-size:26px;opacity:.6;animation:bn 1.8s infinite}
.st{font-weight:800;font-size:clamp(26px,6vw,36px);text-align:center;margin-bottom:34px}
.glass{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);box-shadow:0 8px 30px #4f86b826;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px}
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s,transform .9s}
.rv.in{opacity:1;transform:none}
.cs{text-align:center}
.cake{display:flex;flex-direction:column;align-items:center;margin:50px auto 30px;width:290px}
.cd{display:flex;gap:22px;margin-bottom:-2px}
.cd i{display:block;position:relative;width:9px;height:38px;border-radius:3px;background:linear-gradient(#fffaf0,#efdbad)}
.cd i::after{content:'';position:absolute;top:-22px;left:50%;width:14px;height:22px;margin-left:-7px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(#fff6dc 20%,#f0c46f 55%,transparent 72%);filter:drop-shadow(0 0 6px #f0c46f99);animation:fl .25s infinite alternate;transition:opacity .5s}
.cd i:nth-child(even)::after{animation-delay:-.12s}
@keyframes fl{to{transform:scale(1.15,.9) rotate(4deg)}}
.out .cd i::after{opacity:0}
.t{border-radius:16px 16px 6px 6px;box-shadow:inset 0 14px 0 #fff9,inset 0 -8px 0 #0002}
.t1{width:170px;height:58px;background:linear-gradient(#a9c8e6,#6f98c2)}
.t2{width:250px;height:72px;background:linear-gradient(#f8ebce,#e0c590)}
.pl{width:290px;height:12px;border-radius:99px;background:linear-gradient(90deg,#c9d9e8,#9fb8d1,#c9d9e8)}
.wm{min-height:2em;margin-top:22px;font-size:19px;font-weight:500;color:#8a6528}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chips span{padding:10px 20px;border-radius:99px;font-weight:500;font-size:16px}
.letter{padding:34px 28px;text-align:right;background:linear-gradient(160deg,rgba(255,255,255,.8),rgba(255,255,255,.45));position:relative;overflow:hidden}
.letter::before{content:'❝';position:absolute;top:-10px;left:14px;font-size:110px;opacity:.25;color:#7fa9cf}
.letter h3{font-size:26px;font-weight:800;color:#8a6528;margin-bottom:10px}
.letter p{white-space:pre-wrap;font-weight:500;font-size:18px}
.sg{margin-top:22px;font-weight:800;color:#2f6598}
footer{text-align:center;padding:30px 0 60px;font-weight:500;opacity:.6;font-size:14px}
#bl-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.balloon{position:absolute;bottom:-190px;will-change:transform;animation:rise var(--dur) linear forwards}
.balloon i{display:block;position:relative;width:var(--w);height:calc(var(--w)*1.25);border-radius:50% 50% 50% 50%/58% 58% 42% 42%;background:radial-gradient(circle at 32% 28%,#ffffffcc 0,#ffffff00 28%),var(--c);box-shadow:inset -6px -8px 14px #0000000d,0 6px 20px #6f98c226;opacity:.85;animation:sway var(--sw) ease-in-out infinite alternate}
.balloon i::before{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-5px;border:5px solid transparent;border-bottom:8px solid var(--c);border-top:0}
.balloon i::after{content:"";position:absolute;top:100%;left:50%;width:1.5px;height:calc(var(--w)*1.1);margin-top:4px;background:linear-gradient(#a9b8c8,#a9b8c800)}
@keyframes rise{to{transform:translate3d(var(--dx),calc(-100vh - 420px),0)}}
@keyframes sway{from{transform:translateX(-14px) rotate(-4deg)}to{transform:translateX(14px) rotate(4deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

<script>

  chips:['کللللیییی سلامتییی و آرامشششش❤','رسییدن به هرچی که از دلت میگذره🫂','خنده هایی که تموم نمیشن😍','سفر ها و خوشگذرونی های قشنگ قشنگ😌','دیدن پیشرفتت توی هر لحظه از زندگیت😍','اخرین آرزوم اینه که بمون برام نیمه دیگم همیشه بمون بغلم کن🫀🫂'],
  title:'نیمه دیگه من،',
  text:`یه سال دیگه گذشت و من خیلییی خوشحالمم که یه تولد دیگه تو داریم باهم جشن میگیریم😍
برات کللللیییی آرزوهای قشنگ از ته ته ته قلبم میکنممم و از ته ته ته قلبممممم خیلییییی ذووووق دارم که توی این روز خدا تورو بهمون داده😍🥺
بمونی برامون عشق دلم بمون که من همیشه حالم خوب باشه آرامشم💜
بمون که دنیا برام قشنگ تر باشه لبخندم بمون که بودنت بهم یه حس داشتن تکیه گاه قوی میده🥺♥️
یاد وقتایی افتادم که تو بغلتم وقتی تو بغلت با آرامش میمونم انقد با آرامش که حتی میتونه خوابم ببره تو بغل امنت🥺
یا وقتایی که سیبیلا و ریشات میخورن به صورتم و من چقد خوشم میاد🥺😂(وایییی یاد سیبیلای خوشگلت افتادم😂😍🔥)

const $=id=>document.getElementById(id);
$('nm').textContent=C.name;
$('chips').innerHTML=C.chips.map(c=>`<span class="glass rv">${c}</span>`).join('');
$('lt').textContent=C.title;$('lp').textContent=C.text;$('sg').textContent=C.from;

const cv=$('cv'),x=cv.getContext('2d');let W,H,P=[],S=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<70;i++)S.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.3+.1,a:Math.random()*6});
function burst(cx,cy,n=120){const cl=['#7fa9cf','#ecd9b0','#bcd8ee','#f6e6c4','#4f86b8'];
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*9+3;
    P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,w:Math.random()*7+4,h:Math.random()*4+3,c:cl[i%5],r:Math.random()*6,vr:Math.random()*.4-.2,l:1})}}
(function loop(){x.clearRect(0,0,W,H);
  S.forEach(s=>{s.y-=s.v;s.a+=.03;if(s.y<0)s.y=H;x.globalAlpha=.35+Math.sin(s.a)*.35;x.fillStyle='#7fa6cc';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});
  P=P.filter(p=>p.l>0);
  P.forEach(p=>{p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.008;x.globalAlpha=Math.max(p.l,0);x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
  requestAnimationFrame(loop)})();

function type(el,t,i=0){el.textContent=t.slice(0,i);if(i<t.length)setTimeout(()=>type(el,t,i+1),55)}

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach((e,i)=>{e.style.transitionDelay=(i%3)*.12+'s';io.observe(e)});

$('go').onclick=()=>{
  $('gate').classList.add('off');document.body.classList.remove('lock');
  burst(W/2,H/2,160);setTimeout(()=>burst(W*.2,H*.4,80),300);setTimeout(()=>burst(W*.8,H*.4,80),500);
  setTimeout(()=>type($('ty'),C.sub),700);
  addEventListener('pointerdown',e=>burst(e.clientX,e.clientY,18));
};

$('bl').onclick=e=>{
  const ck=$('ck'),out=ck.classList.toggle('out');
  $('bl').textContent=out?'دوباره روشن کن 🔥':'فوت کن 🌬️';
  $('wm').textContent=out?C.wish:'';
  if(out){const r=ck.getBoundingClientRect();burst(r.left+r.width/2,r.top,150)}
};

$('fr').parentNode.addEventListener('pointermove',e=>{
  const a=(e.clientX/innerWidth-.5)*14,b=(e.clientY/innerHeight-.5)*-10;
  $('fr').style.transform=`perspective(700px) rotateY(${a}deg) rotateX(${b}deg)`});

/* بادکنک‌های همیشگی: از پایین به بالا، بدون قطع شدن */
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const layer=document.getElementById('bl-layer');
  const cols=['#bcd8ee','#a9c8e6','#f6e6c4','#ecd9b0','#cfe0f0','#f8ebce','#8fb3d6'];
  function spawn(){
    if(document.hidden||layer.childElementCount>26)return;
    const b=document.createElement('div'),w=38+Math.random()*44;
    b.className='balloon';
    b.style.cssText=`left:${Math.random()*96}%;--w:${w}px;--c:${cols[Math.random()*cols.length|0]};--dur:${9+Math.random()*8}s;--sw:${2+Math.random()*2}s;--dx:${(Math.random()*120-60)|0}px`;
    b.innerHTML='<i></i>';
    b.addEventListener('animationend',e=>{if(e.animationName==='rise')b.remove()});
    layer.appendChild(b);
  }
  for(let k=0;k<8;k++){setTimeout(spawn,k*350)}
  setInterval(spawn,800);
})();
</script>
</body>
</html>
